<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>註冊 | 敏捷實施法門戶</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell center">
      <section class="card form-card">
        <h1>註冊申請</h1>
        <p>
          僅限 To B 企業客戶註冊（對應 CogniPlatforms / cogniplatforms.com）。
          To C 個人用戶不在此註冊，請前往 cogni-coding.com。
        </p>
        <p class="tip">
          系統會阻擋常見個人郵箱（如 gmail、outlook、yahoo 等）以確保僅受理企業申請。
        </p>

        <form id="register-form" class="form-grid">
          <label>
            姓名
            <input type="text" name="fullName" required />
          </label>
          <label>
            公司名稱
            <input type="text" name="company" required />
          </label>
          <label>
            在企業的職位
            <input type="text" name="jobTitle" required />
          </label>
          <label>
            企業座機
            <input type="text" name="officePhone" required />
          </label>
          <label>
            手機
            <input type="text" name="mobilePhone" required />
          </label>
          <label>
            企業郵箱
            <input type="email" name="email" required />
          </label>
          <label>
            國家/地區
            <select name="region" required>
              <option value="中國香港">中國香港</option>
              <option value="中國大陸">中國大陸</option>
              <option value="其他">其他</option>
            </select>
          </label>
          <label>
            登入密碼
            <input type="password" name="password" minlength="6" required />
          </label>
          <button class="btn primary" type="submit">提交註冊</button>
        </form>

        <p id="register-msg" class="msg"></p>

        <hr class="split" />

        <h2>企業郵箱驗證</h2>
        <p class="tip">輸入企業郵箱與驗證碼。驗證成功後，申請才會進入待審核。</p>
        <form id="verify-form" class="form-grid">
          <label>
            企業郵箱
            <input type="email" name="email" required />
          </label>
          <label>
            驗證碼
            <input type="text" name="code" minlength="6" maxlength="6" required />
          </label>
          <button class="btn primary" type="submit">驗證企業郵箱</button>
        </form>
        <p id="verify-msg" class="msg"></p>

        <div class="actions">
          <a class="btn" href="./login.html">前往登入</a>
          <a class="btn subtle" href="./index.html">返回入口</a>
          <a class="btn" href="https://cogni-coding.com" target="_blank" rel="noreferrer">To C 個人用戶入口</a>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
